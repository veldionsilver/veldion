<!-- popup.html - Veldion Silver Popup -->
<style>
    #veldionPopupOverlay {
        position: fixed;
        inset: 0;
        background: rgba(8, 10, 15, 0.75);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        z-index: 999999;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    #veldionPopupOverlay.show {
        display: flex;
    }

    .popup-box {
        background: #12151C;
        border: 1px solid rgba(192, 197, 206, 0.08);
        border-radius: 20px;
        padding: 32px 28px 28px;
        max-width: 340px;
        width: 100%;
        position: relative;
        text-align: center;
        box-shadow: 0 24px 64px rgba(0,0,0,0.6);
        animation: popupIn 0.3s ease;
    }

    @keyframes popupIn {
        0% { opacity: 0; transform: scale(0.95) translateY(8px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .popup-close {
        position: absolute;
        top: 10px;
        right: 14px;
        background: none;
        border: none;
        color: #64748B;
        font-size: 20px;
        cursor: pointer;
        padding: 4px;
        line-height: 1;
        transition: color 0.2s;
    }
    .popup-close:hover { color: #E2E8F0; }

    .popup-title {
        font-family: 'Sora', sans-serif;
        font-size: 18px;
        font-weight: 700;
        color: white;
        margin: 0 0 4px;
        line-height: 1.3;
    }

    .popup-desc {
        font-size: 14px;
        color: #94A3B8;
        line-height: 1.5;
        margin: 0 0 20px;
    }

    .popup-btn {
        display: inline-block;
        padding: 10px 28px;
        background: linear-gradient(135deg, #E2E8F0, #C0C5CE);
        color: #080A0F;
        font-weight: 600;
        font-size: 14px;
        border: none;
        border-radius: 40px;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.2s;
        text-decoration: none;
        font-family: inherit;
        box-shadow: 0 2px 12px rgba(192, 197, 206, 0.15);
    }
    .popup-btn:hover {
        transform: scale(1.02);
        box-shadow: 0 4px 20px rgba(192, 197, 206, 0.25);
    }
    .popup-btn:active {
        transform: scale(0.97);
    }

    .popup-footer {
        margin-top: 14px;
        font-size: 10px;
        color: #475569;
    }

    @media (max-width: 400px) {
        .popup-box { padding: 24px 18px 18px; }
        .popup-title { font-size: 16px; }
        .popup-desc { font-size: 13px; }
        .popup-btn { font-size: 13px; padding: 8px 22px; }
    }
</style>

<div id="veldionPopupOverlay" role="dialog">
    <div class="popup-box">
        <button class="popup-close" id="popupCloseBtn" aria-label="Tutup">✕</button>

        <div class="popup-title">
            Berita gembira untuk pecinta perak Indonesia.
        </div>

        <p class="popup-desc">
            Veldion Silver sekarang tersedia di Lynk.id.
        </p>

        <a href="https://lynk.id/veldionsilver" target="_blank" rel="noopener" class="popup-btn">
            Belanja di Lynk.id
        </a>

        <div class="popup-footer">Tutup untuk lanjut</div>
    </div>
</div>

<script>
    (function() {
        var overlay = document.getElementById('veldionPopupOverlay');
        var closeBtn = document.getElementById('popupCloseBtn');

        function closePopup() {
            if (overlay) overlay.classList.remove('show');
        }

        function showPopupWhenReady() {
            var checkLoader = setInterval(function() {
                var loader = document.getElementById('veldion-loader');
                if (!loader) {
                    clearInterval(checkLoader);
                    setTimeout(function() {
                        if (overlay) overlay.classList.add('show');
                    }, 300);
                }
            }, 200);

            setTimeout(function() {
                clearInterval(checkLoader);
                if (overlay && !overlay.classList.contains('show')) {
                    overlay.classList.add('show');
                }
            }, 5000);
        }

        if (closeBtn) closeBtn.addEventListener('click', closePopup);

        if (overlay) {
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) closePopup();
            });
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && overlay && overlay.classList.contains('show')) {
                closePopup();
            }
        });

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            showPopupWhenReady();
        } else {
            document.addEventListener('DOMContentLoaded', showPopupWhenReady);
        }

        window.showVeldionPopup = function() {
            if (overlay) overlay.classList.add('show');
        };
        window.closeVeldionPopup = closePopup;
    })();
</script>
